# This workflow will increment version, run tests, commit, publish to PyPI, tag, and create a GitHub release
# For more information see: https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries

name: Release Package

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    # Only allow running from main branch or release/v* branches
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/v')

    steps:
    - name: Check branch
      run: |
        BRANCH_NAME=${GITHUB_REF#refs/heads/}
        if [ "$BRANCH_NAME" != "main" ] && [[ ! "$BRANCH_NAME" =~ ^release/v ]]; then
          echo "❌ Error: This workflow can only be run from 'main' branch or branches matching 'release/v*'"
          echo "Current branch: $BRANCH_NAME"
          exit 1
        fi
        echo "✅ Branch check passed: $BRANCH_NAME"

    - name: Checkout code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libjpeg-dev \
          zlib1g-dev \
          libtiff-dev \
          libfreetype6-dev \
          liblcms2-dev \
          libwebp-dev \
          libharfbuzz-dev \
          libfribidi-dev \
          libxcb1-dev

    - name: Configure Git
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel twine
        pip install -r requirements.txt

    - name: Increment version
      id: version
      run: |
        # Read current version from setup.py
        CURRENT_VERSION=$(grep "version=" setup.py | sed -E "s/.*version='([^']+)'.*/\1/")
        echo "Current version: $CURRENT_VERSION"
        
        # Parse version components
        IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
        MAJOR=${VERSION_PARTS[0]}
        MINOR=${VERSION_PARTS[1]}
        PATCH=${VERSION_PARTS[2]}
        
        # Increment based on input
        BUMP_TYPE="${{ github.event.inputs.version_bump }}"
        if [ "$BUMP_TYPE" = "major" ]; then
          MAJOR=$((MAJOR + 1))
          MINOR=0
          PATCH=0
        elif [ "$BUMP_TYPE" = "minor" ]; then
          MINOR=$((MINOR + 1))
          PATCH=0
        else
          PATCH=$((PATCH + 1))
        fi
        
        NEW_VERSION="$MAJOR.$MINOR.$PATCH"
        echo "New version: $NEW_VERSION"
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        
        # Update setup.py
        sed -i "s/version='[^']*'/version='$NEW_VERSION'/" setup.py
        echo "Updated setup.py with version $NEW_VERSION"

    - name: Run tests
      run: |
        # Run Django compatibility tests
        python test_django_compatibility.py
        
        # Run filebrowser tests
        cd filebrowsertest
        python run_tests.py
        cd ..

    - name: Commit version change
      run: |
        git add setup.py
        git commit -m "Bump version to ${{ steps.version.outputs.version }}"
        echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

    - name: Build and publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        python setup.py sdist bdist_wheel
        twine upload dist/*

    - name: Create and push tag
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        git tag -a "v$VERSION" -m "Release version $VERSION"
        git push origin HEAD
        git push origin "v$VERSION"

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "v${{ steps.version.outputs.version }}" \
          --title "Release v${{ steps.version.outputs.version }}" \
          --notes "Release version ${{ steps.version.outputs.version }}

        ## Changes
        - Version bumped to ${{ steps.version.outputs.version }}
        - Package published to PyPI"
